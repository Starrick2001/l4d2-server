// SuperVersus (Super Versus Reloaded 1.8.16) configuration
// Managed in repo: scripts/l4d_superversus.cfg
// Installed as: left4dead2/cfg/sourcemod/l4d_superversus.cfg (symlink)
// Plugin auto-generates this file on first load if missing; the symlink keeps it versioned.
//
// Slot budget: l4d_survivor_max + l4d_infected_max should stay <= sv_maxplayers (16).
// To raise slots: raise sv_maxplayers in server.cfg AND sv_setmax/sv_maxplayers
// provided by L4DToolZ, then raise the two *_max cvars below.

// Minimum survivors (bots are spawned to meet this number)
l4d_survivor_min "4"
l4d_survivor_limit "5"
// Maximum survivors (per-team cap; 8 + 8 infected = 16 slots)
l4d_survivor_max "8"
// Minimum infected (bots are spawned to meet this number)
l4d_infected_min "4"
// Maximum infected (per-team cap)
l4d_infected_max "8"

// Clear lobby reservation when lobby is full (needs Left4DHooks for the unreserve call)
l4d_killreservation "1"
// Extra first-aid kits for players above 4 (0 = off, 1 = one kit per extra player)
l4d_extra_first_aid "1"
// Respawn alive when joining as extra survivor (first time only)
l4d_respawn_on_join "1"
// In versus/scavenge with fewer infected players than limit, spawn SI bots
l4d_versus_si_more "1"
// AFK handling in versus: 0 = nothing, 1 = idle, 2 = spectator, 3 = kick
l4d_versus_afk "2"
// On connect with no team: 2 = random team, 1 = team menu, 0 = nothing
l4d_autojoin "2"
// 3 = team menu + commands, 2 = commands only, 1 = !infected/!survivor/!join only, 0 = nothing
l4d_management "3"

// Auto-scale difficulty with extra survivors (0 = off, 1 = on)
director_auto_difficulty "1"
// Tank HP multiplier: HP * (1 + multi * (survivors - 4))
director_tank_hpmulti "0.25"
// Special-infected HP multiplier (same formula)
director_si_hpmulti "0.00"
// Common-infected spawn-rate multiplier (same formula)
director_ci_multi "0.25"
// In coop, spawn 1 more SI per extra player (needs director_auto_difficulty 1 + Left4DHooks)
director_si_more "1"
// Extra z_ghost_delay_max seconds for SI bots spawning in versus
director_si_more_delay "5"
