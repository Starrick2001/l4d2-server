// L4D2 Dedicated Server Configuration

// Server info
sv_lan 0
sv_region 0

// Difficulty (0=Easy, 1=Normal, 2=Hard, 3=Impossible)
z_difficulty 2

// Game mode (0=Campaign, 1=Versus, 2=Survival, 4=Scavenge)
mp_gamemode "coop"

// Tick rate
sv_minrate 80000
sv_maxrate 30000
sv_mincmdrate 33
sv_maxcmdrate 100
sv_client_cmdrate_difference 40

// Performance
mem_max_heapsize 2048

// Voting
sv_allow_votes 1
sv_vote_timer_duration 20

// Friendly fire
friendly_fire 1
ff_damage_reduction 0.25

// Survivor limit
survivor_limit 4

// Enable RCON
rcon_password "changeme123"

// Logging
log on
sv_logecho 1
sv_log_onefile 0

// Chat and communication
sv_alltalk 0
sv_deadtalk 1

// Cheats off
sv_cheats 0

// Execute ban list
exec banned_user.cfg
exec banned_ip.cfg
